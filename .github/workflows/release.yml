name: Verify and create release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable v3 tag to create after verification
        required: true
        type: string

permissions:
  contents: read

env:
  GOWORK: 'off'

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the requested release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "refusing to release from $GITHUB_REF; dispatch this workflow from main" >&2
            exit 1
          fi
          stable_v3='^v3\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $stable_v3 ]]; then
            echo "refusing non-stable or non-v3 tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "refusing to replace existing tag $RELEASE_TAG" >&2
            exit 1
          fi

  verify:
    name: Offline release verification
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the public stable delinea-common API
        run: |
          replacements="$(go mod edit -json | jq '.Replace | length')"
          if [[ "$replacements" != 0 ]]; then
            echo "refusing release with module replacements" >&2
            go mod edit -json | jq '.Replace' >&2
            exit 1
          fi
          version="$(go list -m -f '{{.Version}}' github.com/DelineaXPM/delinea-common)"
          stable_v1='^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$version" =~ $stable_v1 ]]; then
            echo "refusing release with delinea-common $version; require a stable public v1 release" >&2
            exit 1
          fi
      - run: go mod download
      - run: go mod verify
      - run: go mod tidy -diff
      - name: Require the reviewed two-module graph
        run: |
          unexpected="$(go list -m all | awk '$1 != "github.com/DelineaXPM/tss-sdk-go/v3" && $1 != "github.com/DelineaXPM/delinea-common"')"
          if [[ -n "$unexpected" ]]; then
            echo "refusing release with unreviewed transitive modules:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
      - run: go build -v ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.10 -quiet ./...

  integration:
    name: Required live Secret Server and Platform battery
    needs: validate
    runs-on: ubuntu-latest
    environment: live-tests
    timeout-minutes: 30
    concurrency:
      group: live-tenant-battery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod download
      - run: go mod verify
      - name: run strict live battery
        env:
          TSS_REQUIRE_SECRET_SERVER: '1'
          TSS_REQUIRE_PLATFORM: '1'
          TSS_SERVER_URL: ${{ vars.TSS_SERVER_URL }}
          TSS_USERNAME: ${{ vars.TSS_USERNAME }}
          TSS_PASSWORD: ${{ secrets.TSS_PASSWORD }}
          TSS_SECRET_ID: ${{ vars.TSS_SECRET_ID }}
          TSS_SECRET_PATH: ${{ vars.TSS_SECRET_PATH }}
          TSS_TEMPLATE_ID: ${{ vars.TSS_TEMPLATE_ID }}
          TSS_FOLDER_ID: ${{ vars.TSS_FOLDER_ID }}
          TSS_SITE_ID: ${{ vars.TSS_SITE_ID }}
          TSS_SSH_KEY_TEMPLATE_ID: ${{ vars.TSS_SSH_KEY_TEMPLATE_ID }}
          TSS_TEST_PASSWORD: ${{ secrets.TSS_TEST_PASSWORD }}
          TSS_SEARCH_FIELD: ${{ vars.TSS_SEARCH_FIELD }}
          TSS_SEARCH_TEXT: ${{ vars.TSS_SEARCH_TEXT }}
          TSS_PLATFORM_USERNAME: ${{ vars.TSS_PLATFORM_CLIENT_ID }}
          TSS_PLATFORM_PASSWORD: ${{ secrets.TSS_PLATFORM_CLIENT_SECRET }}
          TSS_PLATFORM_URL: ${{ vars.TSS_PLATFORM_URL }}
          TSS_PLATFORM_ALLOWED_VAULT_HOSTS: ${{ vars.TSS_PLATFORM_ALLOWED_VAULT_HOSTS }}
          TSS_PLATFORM_SECRET_ID: ${{ vars.TSS_PLATFORM_SECRET_ID }}
          TSS_PLATFORM_SECRET_PATH: ${{ vars.TSS_PLATFORM_SECRET_PATH }}
          TSS_PLATFORM_TEMPLATE_ID: ${{ vars.TSS_PLATFORM_TEMPLATE_ID }}
          TSS_PLATFORM_FOLDER_ID: ${{ vars.TSS_PLATFORM_FOLDER_ID }}
          TSS_PLATFORM_SITE_ID: ${{ vars.TSS_PLATFORM_SITE_ID }}
          TSS_PLATFORM_SSH_KEY_TEMPLATE_ID: ${{ vars.TSS_PLATFORM_SSH_KEY_TEMPLATE_ID }}
          TSS_PLATFORM_TEST_PASSWORD: ${{ secrets.TSS_PLATFORM_TEST_PASSWORD }}
          TSS_PLATFORM_SEARCH_FIELD: ${{ vars.TSS_PLATFORM_SEARCH_FIELD }}
          TSS_PLATFORM_SEARCH_TEXT: ${{ vars.TSS_PLATFORM_SEARCH_TEXT }}
        run: go test -count=1 -race -v ./server

  tag:
    name: Create verified release tag
    needs: [verify, integration]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "refusing to replace existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
